[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mycel"
version = "2.0.0"
description = "A finite command line for maintained repository knowledge"
requires-python = ">=3.13"
dependencies = ["tokenizers==0.23.2", "PyYAML==6.0.3", "tree-sitter==0.26.0", "tree-sitter-typescript==0.23.2", "tree-sitter-javascript==0.25.0", "psycopg[binary]==3.3.6", "pathspec==1.1.1", "numpy==2.5.4", "scipy==1.18.1", "scikit-learn==1.9.1"]

[project.scripts]
mycel = "mycel._cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mycel", "mycel.*"]

[tool.setuptools.package-data]
mycel = ["data/*.json", "data/*.txt"]
