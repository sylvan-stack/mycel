<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Summary trees</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      color: CanvasText;
      background: Canvas;
      font: 1.125rem/1.6 system-ui, sans-serif;
    }
    main {
      box-sizing: border-box;
      max-inline-size: 72ch;
      margin-inline: auto;
      padding: 2rem clamp(1rem, 5vw, 2rem) 3rem;
    }
    p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    p + p, .branch + .branch, .children { margin-block-start: .65em; }
    .children { display: flex; }
    .children::before { content: "    "; white-space: pre; }
    .children > div { flex: 1; min-inline-size: 0; }
    [data-view]:focus-visible { outline: 1px dotted currentColor; outline-offset: .2rem; }
    [data-hover] { outline: 1px solid currentColor; outline-offset: .2rem; }
    [data-hover="open"] { cursor: zoom-in; }
    [data-hover="close"] { cursor: zoom-out; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script id="summary-data" type="application/json">__MYCEL_SUMMARY_DATA__</script>
  <script>
    "use strict";
    const trees = JSON.parse(document.getElementById("summary-data").textContent);
    const treesByRepository = new Map(trees.map(tree => [tree.repository, tree]));
    const app = document.getElementById("app");
    let pointer = null;
    let highlighted = null;
    let modifiers = { metaKey: false, shiftKey: false };

    function paragraph(text, view, id) {
      const item = document.createElement("p");
      item.textContent = text;
      if (view) {
        item.dataset.view = view;
        item.dataset.id = id;
        item.tabIndex = 0;
        item.setAttribute("role", "button");
      }
      return item;
    }

    function branch(item) {
      const block = document.createElement("div");
      block.className = "branch";
      block.append(item);
      return block;
    }

    function showRepositories() {
      for (const { repository } of trees) {
        const block = branch(paragraph(repository, "repository", repository));
        block.dataset.repository = repository;
        app.append(block);
      }
      if (!trees.length) app.append(paragraph("No published summary trees."));
    }

    function treeFor(target) {
      return treesByRepository.get(target.closest("[data-repository]").dataset.repository);
    }

    function branches(tree, ids) {
      const list = document.createElement("div");
      for (const id of ids) {
        list.append(branch(paragraph(tree.nodes[id].label, "label", id)));
      }
      return list;
    }

    function canOpen(target) {
      if (target.dataset.view === "label") return true;
      if (target.nextElementSibling) return false;
      return target.dataset.view === "repository" || treeFor(target).nodes[target.dataset.id].children.length > 0;
    }

    function canClose(target) {
      return target.dataset.view !== "repository" || Boolean(target.nextElementSibling);
    }

    function updateRole(target) {
      if (canOpen(target)) target.setAttribute("role", "button");
      else target.removeAttribute("role");
    }

    function expand(target, focus) {
      const tree = treeFor(target);
      const id = target.dataset.id;
      if (target.dataset.view === "label") {
        target.dataset.view = "text";
        target.textContent = tree.nodes[id].text ?? "Retained text is unavailable.";
        updateRole(target);
      } else {
        const ids = target.dataset.view === "repository" ? tree.roots : tree.nodes[id].children;
        const children = document.createElement("div");
        children.className = "children";
        children.append(branches(tree, ids));
        target.after(children);
        updateRole(target);
        if (focus) children.querySelector("[data-view]")?.focus();
      }
      updateHover();
    }

    function collapse(target, focus) {
      const text = target.dataset.view === "label" ? target.closest(".children").previousElementSibling : target;
      const children = text.nextElementSibling;
      const restoreFocus = focus || children?.contains(document.activeElement);
      if (children) children.remove();
      else {
        text.dataset.view = "label";
        text.textContent = treeFor(text).nodes[text.dataset.id].label;
      }
      updateRole(text);
      if (restoreFocus) text.focus();
      updateHover();
    }

    function updateHover() {
      if (highlighted) delete highlighted.dataset.hover;
      highlighted = null;
      const target = pointer && document.elementFromPoint(pointer.x, pointer.y)?.closest("[data-view]");
      if (!target) return;
      if (modifiers.shiftKey) {
        if (!canClose(target)) return;
        target.dataset.hover = "close";
      } else if (modifiers.metaKey && canOpen(target)) {
        target.dataset.hover = "open";
      } else {
        return;
      }
      highlighted = target;
    }

    app.addEventListener("click", event => {
      const target = event.target.closest("[data-view]");
      if (!target) return;
      if (event.shiftKey && canClose(target)) {
        event.preventDefault();
        collapse(target, false);
      } else if (!event.shiftKey && event.metaKey && canOpen(target)) {
        event.preventDefault();
        expand(target, false);
      }
    });

    document.addEventListener("keydown", event => {
      const target = document.activeElement?.closest("[data-view]");
      if (!target) return;
      if (event.key === "Escape" && canClose(target)) {
        event.preventDefault();
        if (!event.repeat) collapse(target, true);
      } else if ((event.key === "Enter" || event.key === " ") && canOpen(target)) {
        event.preventDefault();
        if (!event.repeat) expand(target, true);
      }
    });

    document.addEventListener("pointermove", event => {
      pointer = { x: event.clientX, y: event.clientY };
      modifiers = event;
      updateHover();
    });
    document.addEventListener("pointerleave", () => { pointer = null; updateHover(); });
    for (const name of ["keydown", "keyup"]) {
      window.addEventListener(name, event => { modifiers = event; updateHover(); });
    }
    window.addEventListener("blur", () => {
      modifiers = { metaKey: false, shiftKey: false };
      updateHover();
    });
    window.addEventListener("scroll", updateHover, { passive: true });

    showRepositories();
  </script>
</body>
</html>
